name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run live PGS Catalog / Europe PMC smoke tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Lockfile is current with pyproject.toml
        run: uv lock --check
      - name: Set up PRSGuard (uv.lock versions) and the pinned ClawBio checkout
        run: scripts/setup.sh
      - name: Lint (ruff)
        run: .venv/bin/python -m ruff check prsguard benchmarks tests skills/prs-applicability-gate
      - name: Offline tests (PRSGuard, gate skill, equity-lit-auditor, legacy v1 evals)
        run: .venv/bin/python -m pytest -q
      - name: Gate skill via ClawBio runner
        run: cd vendor/ClawBio && ../../.venv/bin/python clawbio.py run prs-gate --demo --output "$RUNNER_TEMP/gate_demo"
      - name: Demo cases reproduce
        run: .venv/bin/prsguard demo --out "$RUNNER_TEMP/demo"
      - name: Live smoke tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
        env:
          RUN_LIVE_TESTS: "1"
        run: .venv/bin/python -m pytest -q -m network

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      - run: npm test
